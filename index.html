<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pixel Forge — Games by the maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12141c;
    --bg-alt:#181b28;
    --panel:#1e2233;
    --cartridge:#262b40;
    --cartridge-hi:#2e3450;
    --border:#3a3f5c;
    --text:#eeece6;
    --text-dim:#9aa0bd;
    --red:#e8503a;
    --red-hi:#ff6a51;
    --gold:#f2c14e;
    --green:#5fbf7a;
    --radius:10px;
    --shadow: 0 12px 30px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, rgba(232,80,58,0.10), transparent 45%),
      radial-gradient(ellipse at 90% 0%, rgba(242,193,78,0.08), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', system-ui, sans-serif;
    min-height:100vh;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top, 0px);}
  .pixel{font-family:'Press Start 2P', monospace; letter-spacing:0.5px;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  img{max-width:100%; display:block;}
  ::selection{background:var(--red); color:#fff;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--cartridge-hi); border-radius:10px;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  .hidden{display:none !important;}

  /* ---------- Header ---------- */
  header.site{
    position:sticky; top:0; z-index:40;
    background:rgba(18,20,28,0.86); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding-top:env(safe-area-inset-top, 0px);
  }
  .header-inner{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; max-width:1180px; margin:0 auto;}
  .logo{display:flex; align-items:center; gap:10px; font-size:14px; background:none; border:none; padding:0; color:inherit;}
  .logo .chip{
    width:34px; height:34px; border-radius:7px; background:linear-gradient(145deg, var(--red), #a8331f);
    display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(232,80,58,0.35);
    font-size:15px; flex-shrink:0;
  }
  .logo-name{font-size:13px; line-height:1.4; text-align:left;}
  .logo-name span{display:block; color:var(--text-dim); font-size:9px; letter-spacing:1.5px; text-transform:uppercase; margin-top:2px;}
  nav.site-nav{display:flex; align-items:center; gap:22px;}
  nav.site-nav .nav-link{font-size:14px; color:var(--text-dim); text-decoration:none; transition:color .15s; background:none; border:none; padding:0; font-family:inherit;}
  nav.site-nav .nav-link:hover{color:var(--text);}

  /* ---------- Buttons ---------- */
  .btn{
    border:none; border-radius:8px; padding:13px 22px; font-size:14px; font-weight:700;
    display:inline-flex; align-items:center; gap:8px; transition:transform .12s, box-shadow .12s, background .15s;
  }
  .btn-primary{background:var(--red); color:#fff; box-shadow:0 8px 20px rgba(232,80,58,0.3);}
  .btn-primary:hover{background:var(--red-hi); transform:translateY(-1px);}
  .btn-ghost{background:transparent; border:1px solid var(--border); color:var(--text);}
  .btn-ghost:hover{border-color:var(--text-dim);}
  .btn-gold{background:var(--gold); color:#241b04;}
  .btn-gold:hover{filter:brightness(1.08); transform:translateY(-1px);}
  .btn-sm{padding:8px 14px; font-size:12.5px; border-radius:7px;}

  /* ---------- Hero ---------- */
  .hero{padding:56px 24px 20px; max-width:1180px; margin:0 auto;}
  .hero-eyebrow{color:var(--gold); font-size:11px; letter-spacing:2px; text-transform:uppercase; margin-bottom:16px; display:flex; align-items:center; gap:10px;}
  .hero-eyebrow::before{content:''; width:26px; height:2px; background:var(--gold); display:inline-block;}
  .hero-showcase{display:grid; grid-template-columns:1.05fr 0.95fr; gap:44px; align-items:center;}
  .hero-copy h1{font-family:'Press Start 2P'; font-size:clamp(19px,3vw,29px); line-height:1.65; margin:0 0 16px;}
  .hero-copy .tag{color:var(--text-dim); font-size:15px; line-height:1.65; margin:0 0 22px; max-width:480px;}
  .hero-badges{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px;}
  .hero-actions{display:flex; gap:12px; flex-wrap:wrap;}
  .hero-video-frame{
    position:relative; border-radius:14px; overflow:hidden; aspect-ratio:16/9;
    background:linear-gradient(135deg, var(--panel), var(--cartridge-hi));
    border:1px solid var(--border); box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center;
  }
  .hero-video-frame iframe, .hero-video-frame video, .hero-video-frame img{width:100%; height:100%; object-fit:cover; border:0;}
  .hero-video-frame .fallback{font-family:'Press Start 2P'; font-size:34px; color:var(--border);}
  .hero-empty h1{font-family:'Press Start 2P'; font-size:clamp(18px,3vw,26px); line-height:1.65; margin:0 0 14px;}
  .hero-empty p{color:var(--text-dim); font-size:15px; max-width:520px; line-height:1.6;}

  .status-pill{padding:4px 11px; border-radius:20px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; display:inline-block;}
  .status-released{background:rgba(95,191,122,0.15); color:var(--green);}
  .status-development{background:rgba(242,193,78,0.15); color:var(--gold);}
  .status-prototype{background:rgba(154,160,189,0.15); color:var(--text-dim);}
  .genre-pill{background:rgba(238,236,230,0.08); color:var(--text-dim); padding:4px 11px; border-radius:20px; font-size:11px; letter-spacing:.5px;}

  /* ---------- Sections ---------- */
  .section{padding:16px 24px 70px; max-width:1180px; margin:0 auto;}
  .section-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:28px; gap:20px; flex-wrap:wrap;}
  .section-head h2{font-family:'Press Start 2P'; font-size:16px; margin:0 0 6px;}
  .section-head p{color:var(--text-dim); font-size:14px; margin:0;}
  .filters{display:flex; gap:8px; flex-wrap:wrap;}
  .chip-filter{background:var(--panel); border:1px solid var(--border); color:var(--text-dim); padding:7px 13px; border-radius:20px; font-size:12.5px;}
  .chip-filter.active{background:var(--red); color:#fff; border-color:var(--red);}

  /* ---------- Game grid / cartridge cards ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:22px;}
  .empty-state{
    grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--text-dim);
    border:1px dashed var(--border); border-radius:var(--radius);
  }
  .empty-state .pixel{color:var(--text); font-size:11px; display:block; margin-bottom:12px;}

  .cart-card{
    position:relative; background:var(--cartridge);
    border:1px solid var(--border); border-radius:12px;
    padding:16px; display:flex; flex-direction:column; gap:12px;
    clip-path: polygon(0 18px, 18px 0, 100% 0, 100% 100%, 0 100%);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s;
    text-align:left; width:100%;
  }
  .cart-card:hover{transform:translateY(-5px) rotate(-0.4deg); box-shadow:var(--shadow); border-color:var(--red);}
  .cart-cover{
    width:100%; aspect-ratio:4/3; border-radius:8px; overflow:hidden;
    background:linear-gradient(135deg, var(--panel), var(--cartridge-hi));
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .cart-cover img{width:100%; height:100%; object-fit:cover;}
  .cart-cover .fallback{font-family:'Press Start 2P'; font-size:22px; color:var(--border);}
  .cart-cover .play-badge{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(18,20,28,0.0); transition:background .15s;}
  .cart-card:hover .play-badge{background:rgba(18,20,28,0.25);}
  .cart-cover .play-badge span{
    width:40px; height:40px; border-radius:50%; background:rgba(18,20,28,0.7); border:1px solid rgba(255,255,255,0.25);
    display:flex; align-items:center; justify-content:center; font-size:14px; opacity:0; transition:opacity .15s;
  }
  .cart-card:hover .play-badge span{opacity:1;}
  .cart-genre{
    position:absolute; top:8px; left:8px; background:rgba(18,20,28,0.75); backdrop-filter:blur(4px);
    color:var(--gold); font-size:10px; letter-spacing:1px; text-transform:uppercase; padding:4px 9px; border-radius:5px;
  }
  .cart-body h3{margin:0; font-size:16.5px; font-weight:700;}
  .cart-body .tagline{color:var(--text-dim); font-size:13px; margin:6px 0 0; line-height:1.5; min-height:38px;}
  .cart-foot{display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:8px; border-top:1px dashed var(--border); gap:10px;}

  /* ---------- Modal / lightbox ---------- */
  .modal-overlay{position:fixed; inset:0; background:rgba(8,9,14,0.65); backdrop-filter:blur(2px); z-index:80; display:flex; align-items:center; justify-content:center; padding:20px;}
  .modal{background:var(--bg-alt); border:1px solid var(--border); border-radius:14px; width:min(620px,100%); max-height:88vh; overflow-y:auto; box-shadow:var(--shadow); animation:pop .18s ease;}
  @keyframes pop{from{opacity:0; transform:scale(.96);} to{opacity:1; transform:scale(1);}}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:20px 22px; border-bottom:1px solid var(--border); gap:14px;}
  .modal-head h3{margin:0; font-family:'Press Start 2P'; font-size:12.5px; line-height:1.6;}
  .close-x{background:none; border:none; color:var(--text-dim); font-size:22px; line-height:1; flex-shrink:0;}
  .close-x:hover{color:var(--text);}
  .modal-body{padding:22px;}

  .detail-media{border-radius:10px; overflow:hidden; aspect-ratio:16/9; background:var(--panel); border:1px solid var(--border); display:flex; align-items:center; justify-content:center;}
  .detail-media iframe, .detail-media video, .detail-media img{width:100%; height:100%; object-fit:cover; border:0;}
  .detail-media .fallback{font-family:'Press Start 2P'; font-size:26px; color:var(--border);}
  .detail-meta-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:14px;}
  .detail-desc{color:var(--text-dim); font-size:14.5px; line-height:1.7; margin-top:16px; white-space:pre-wrap;}
  .screenshot-strip{display:flex; gap:10px; overflow-x:auto; padding:4px 2px 10px; margin-top:16px;}
  .screenshot-strip img{height:120px; width:auto; border-radius:8px; cursor:zoom-in; flex-shrink:0; border:1px solid var(--border);}
  .platform-links{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px;}

  .lightbox-overlay{position:fixed; inset:0; background:rgba(5,6,10,0.9); z-index:90; display:flex; align-items:center; justify-content:center; padding:30px;}
  .lightbox-overlay img{max-width:100%; max-height:88vh; border-radius:8px; box-shadow:var(--shadow);}
  .lightbox-close{position:absolute; top:20px; right:26px; background:none; border:none; color:#fff; font-size:30px;}

  /* ---------- About / Contact ---------- */
  .about-grid{display:grid; grid-template-columns:0.9fr 1.1fr; gap:40px; align-items:start;}
  .about-portrait{aspect-ratio:1/1; border-radius:12px; background:linear-gradient(135deg, var(--panel), var(--cartridge-hi)); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .about-portrait img{width:100%; height:100%; object-fit:cover;}
  .about-portrait .fallback{font-size:40px;}
  .about-text{color:var(--text-dim); font-size:15px; line-height:1.75; white-space:pre-wrap;}
  .social-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:22px;}
  .social-pill{background:var(--panel); border:1px solid var(--border); color:var(--text); padding:9px 16px; border-radius:8px; font-size:13.5px; font-weight:600; text-decoration:none; display:inline-flex; align-items:center; gap:8px;}
  .social-pill:hover{border-color:var(--gold);}

  /* ---------- Footer ---------- */
  footer.site{border-top:1px solid var(--border); padding:36px 24px; margin-top:40px; padding-bottom:calc(36px + env(safe-area-inset-bottom, 0px));}
  .footer-inner{max-width:1180px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;}
  .footer-inner p{color:var(--text-dim); font-size:12.5px; margin:0;}

  @media (max-width:900px){
    .hero-showcase{grid-template-columns:1fr;}
    .about-grid{grid-template-columns:1fr;}
    .about-portrait{max-width:220px;}
  }
  @media (max-width:640px){
    nav.site-nav .nav-link{display:none;}
    .hero{padding:44px 20px 10px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ } }
  :root[data-theme="dark"]{ }
</style>
</head>
<body>

<!--
  ============================================================
  CONTENT: everything shown on this site lives in the SITE and
  GAMES objects below. There is no admin panel or login — to add,
  edit, or remove a game, or to change the bio/contact info, just
  ask Claude to update it and republish. This keeps the page fully
  public and instant to load for every visitor, on every device,
  with nothing to log into and nothing that can go out of sync.
  ============================================================
-->

<header class="site">
  <div class="header-inner">
    <button class="logo" onclick="scrollToId('top')">
      <div class="chip">🎮</div>
      <div class="logo-name" id="storeNameHeader"></div>
    </button>
    <nav class="site-nav">
      <button class="nav-link" onclick="scrollToId('gamesSection')">Games</button>
      <button class="nav-link" onclick="scrollToId('aboutSection')">About</button>
      <button class="nav-link" onclick="scrollToId('contactSection')">Contact</button>
    </nav>
  </div>
</header>
<div id="top"></div>

<main>
  <section class="hero" id="heroSection"></section>

  <section class="section" id="gamesSection">
    <div class="section-head">
      <div>
        <h2>THE SHELF</h2>
        <p id="gameCountLabel"></p>
      </div>
      <div class="filters" id="genreFilters"></div>
    </div>
    <div class="grid" id="gamesGrid"></div>
  </section>

  <section class="section" id="aboutSection">
    <div class="section-head">
      <div>
        <h2>ABOUT</h2>
        <p>The person behind the games.</p>
      </div>
    </div>
    <div class="about-grid">
      <div class="about-portrait" id="aboutPortrait"><span class="fallback">👾</span></div>
      <div>
        <p class="about-text" id="aboutText"></p>
        <div class="social-row" id="socialRow"></div>
      </div>
    </div>
  </section>

  <section class="section" id="contactSection" style="padding-top:0; padding-bottom:40px;">
    <div class="section-head">
      <div>
        <h2>GET IN TOUCH</h2>
        <p id="contactSub"></p>
      </div>
    </div>
    <div id="contactBox"></div>
  </section>
</main>

<footer class="site">
  <div class="footer-inner">
    <p id="footerText"></p>
    <p>A showcase of independently made games.</p>
  </div>
</footer>

<div id="modalRoot"></div>
<div id="lightboxRoot"></div>

<script>
/* ================================================================
   CONTENT — edit these two objects (or ask Claude to) to change
   what the site shows. Nothing here reaches a server; the page is
   fully static.
================================================================= */
const SITE = {
  storeName: 'PIXEL FORGE',
  tagline: 'Games, made solo',
  heroHeadline: 'The latest build',
  heroSub: "Every game here was designed, built, and shipped by a single maker. Watch the trailer, browse the shelf, and play what looks fun.",
  portraitUrl: '',
  aboutText: "This maker hasn't written a bio yet — ask Claude to fill this in with a real one.",
  contactEmail: '',
  contactSub: 'Questions, feedback, or just want to say hi?',
  socialLinks: [
    // { label: 'itch.io', url: 'https://yourname.itch.io' },
    // { label: 'Twitter / X', url: 'https://x.com/yourname' },
  ],
};

// One entry per game. `status`: 'released' | 'development' | 'prototype'.
// `featured: true` on (at most) one game puts it in the hero.
const GAMES = [
  // Example — replace or remove, then ask Claude to add your real games:
  // {
  //   id: 'sample-game',
  //   title: 'Sample Game',
  //   tagline: 'A short, punchy one-liner.',
  //   description: 'A longer description of the game — what it is, how you play, what makes it worth trying.',
  //   status: 'released',
  //   genre: 'Platformer',
  //   coverUrl: 'https://example.com/cover.png',
  //   videoUrl: 'https://youtu.be/xxxxxxxx',
  //   screenshots: ['https://example.com/shot1.png', 'https://example.com/shot2.png'],
  //   platforms: [{ label: 'Play on itch.io', url: 'https://yourname.itch.io/sample-game' }],
  //   published: true,
  //   featured: true,
  // },
];

/* ================================================================
   Rendering — no storage, no admin, just draws SITE + GAMES.
================================================================= */
function scrollToId(id){ document.getElementById(id)?.scrollIntoView({behavior:'smooth'}); }
function esc(s){ const d=document.createElement('div'); d.innerText = s ?? ''; return d.innerHTML; }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }

const STATUS_LABELS = {released:'Released', development:'In development', prototype:'Prototype'};
function statusBadge(status){
  const s = status || 'released';
  const cls = s==='development' ? 'status-development' : s==='prototype' ? 'status-prototype' : 'status-released';
  return `<span class="status-pill ${cls}">${STATUS_LABELS[s]||'Released'}</span>`;
}

function toEmbedUrl(url){
  if(!url) return null;
  try{
    const u = new URL(url);
    const host = u.hostname.replace(/^www\./,'');
    if(host === 'youtube.com' || host === 'm.youtube.com'){
      const id = u.pathname.startsWith('/embed/') ? u.pathname.split('/')[2] : u.searchParams.get('v');
      return id ? `https://www.youtube.com/embed/${id}` : null;
    }
    if(host === 'youtu.be'){
      const id = u.pathname.slice(1);
      return id ? `https://www.youtube.com/embed/${id}` : null;
    }
    if(host === 'vimeo.com'){
      const id = u.pathname.split('/').filter(Boolean).pop();
      return id ? `https://player.vimeo.com/video/${id}` : null;
    }
  }catch(e){ /* not a valid URL */ }
  return null;
}
function isDirectVideoFile(url){ return /\.(mp4|webm|ogg)(\?.*)?$/i.test(url||''); }
function videoBlockHtml(videoUrl, posterUrl, title){
  if(videoUrl){
    if(isDirectVideoFile(videoUrl)){
      return `<video controls playsinline poster="${escAttr(posterUrl||'')}" src="${escAttr(videoUrl)}"></video>`;
    }
    const embed = toEmbedUrl(videoUrl);
    if(embed){
      return `<iframe src="${escAttr(embed)}" title="${escAttr(title)} trailer" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
    }
  }
  if(posterUrl){
    return `<img src="${escAttr(posterUrl)}" alt="${escAttr(title)} cover" onerror="this.parentElement.innerHTML='<span class=fallback>🎮</span>'"/>`;
  }
  return `<span class="fallback">🎮</span>`;
}

let activeGenre = 'All';

function applySiteToDom(){
  document.title = SITE.storeName + ' — Games by the maker';
  document.getElementById('storeNameHeader').innerHTML = esc(SITE.storeName) + '<span>'+esc(SITE.tagline)+'</span>';
  document.getElementById('footerText').innerText = '© ' + SITE.storeName + ' — built and shown by one developer.';
}

function renderHero(){
  const el = document.getElementById('heroSection');
  const published = GAMES.filter(g=>g.published !== false);
  const featured = published.find(g=>g.featured) || published[0];

  if(!featured){
    el.innerHTML = `
      <div class="hero-empty">
        <div class="hero-eyebrow">One developer. Real games.</div>
        <h1>New cartridges are on the way.</h1>
        <p>This shelf is being stocked. Check back soon, or reach out below.</p>
      </div>`;
    return;
  }

  el.innerHTML = `
    <div class="hero-eyebrow">${featured.featured ? 'Featured build' : 'Latest build'}</div>
    <div class="hero-showcase">
      <div class="hero-copy">
        <h1>${esc(SITE.heroHeadline)}</h1>
        <p class="tag">${esc(SITE.heroSub)}</p>
        <div class="hero-badges">
          ${statusBadge(featured.status)}
          ${featured.genre ? `<span class="genre-pill">${esc(featured.genre)}</span>` : ''}
        </div>
        <div class="hero-actions">
          <button class="btn btn-primary" onclick="openGameDetail('${featured.id}')">See ${esc(featured.title)} →</button>
          <button class="btn btn-ghost" onclick="scrollToId('gamesSection')">Browse the shelf</button>
        </div>
      </div>
      <div class="hero-video-frame">${videoBlockHtml(featured.videoUrl, featured.coverUrl, featured.title)}</div>
    </div>
  `;
}

function renderGenreFilters(){
  const genres = ['All', ...new Set(GAMES.filter(g=>g.published !== false).map(g=>g.genre).filter(Boolean))];
  const el = document.getElementById('genreFilters');
  el.innerHTML = genres.map(g => `<button class="chip-filter ${g===activeGenre?'active':''}" onclick="setGenreFilter('${escAttr(g)}')">${esc(g)}</button>`).join('');
}
function setGenreFilter(g){ activeGenre = g; renderGenreFilters(); renderGamesGrid(); }

function renderGamesGrid(){
  const grid = document.getElementById('gamesGrid');
  const visible = GAMES.filter(g => g.published !== false && (activeGenre==='All' || g.genre===activeGenre));
  document.getElementById('gameCountLabel').innerText = visible.length ? `${visible.length} game${visible.length>1?'s':''} on the shelf` : 'The shelf is empty right now';
  if(visible.length===0){
    grid.innerHTML = `<div class="empty-state"><span class="pixel">NO CARTRIDGES YET</span>Check back soon — new games are on the way.</div>`;
    return;
  }
  grid.innerHTML = visible.map(g => `
    <button class="cart-card" onclick="openGameDetail('${g.id}')">
      <div class="cart-cover">
        ${g.coverUrl ? `<img src="${escAttr(g.coverUrl)}" alt="${escAttr(g.title)} cover" onerror="this.parentElement.querySelector('img').remove(); this.parentElement.insertAdjacentHTML('afterbegin','<div class=fallback>🎮</div>')"/>` : `<div class="fallback">🎮</div>`}
        ${g.genre ? `<span class="cart-genre">${esc(g.genre)}</span>` : ''}
        <div class="play-badge"><span>▶</span></div>
      </div>
      <div class="cart-body">
        <h3>${esc(g.title)}</h3>
        <p class="tagline">${esc(g.tagline||'')}</p>
      </div>
      <div class="cart-foot">
        ${statusBadge(g.status)}
        <span class="hint" style="margin:0; color:var(--text-dim); font-size:12.5px;">View details</span>
      </div>
    </button>
  `).join('');
}

function openGameDetail(gameId){
  const g = GAMES.find(x=>x.id===gameId);
  if(!g) return;
  const platforms = g.platforms || [];
  showModal(`
    <div class="modal-head"><h3>${esc(g.title)}</h3><button class="close-x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="detail-media">${videoBlockHtml(g.videoUrl, g.coverUrl, g.title)}</div>
      <div class="detail-meta-row">
        ${statusBadge(g.status)}
        ${g.genre ? `<span class="genre-pill">${esc(g.genre)}</span>` : ''}
      </div>
      ${g.description ? `<p class="detail-desc">${esc(g.description)}</p>` : (g.tagline ? `<p class="detail-desc">${esc(g.tagline)}</p>` : '')}
      ${(g.screenshots && g.screenshots.length) ? `
        <div class="screenshot-strip">
          ${g.screenshots.map(s=>`<img src="${escAttr(s)}" alt="${escAttr(g.title)} screenshot" onclick="openLightbox('${escAttr(s)}')" onerror="this.remove()"/>`).join('')}
        </div>` : ''}
      ${platforms.length ? `
        <div class="platform-links">
          ${platforms.map(p=>`<a class="btn btn-gold btn-sm" href="${escAttr(p.url)}" target="_blank" rel="noopener">${esc(p.label||'Play')}</a>`).join('')}
        </div>` : ''}
    </div>
  `);
}
function openLightbox(url){
  document.getElementById('lightboxRoot').innerHTML = `
    <div class="lightbox-overlay" onclick="if(event.target===this) closeLightbox()">
      <button class="lightbox-close" onclick="closeLightbox()">×</button>
      <img src="${escAttr(url)}" alt="Screenshot"/>
    </div>`;
}
function closeLightbox(){ document.getElementById('lightboxRoot').innerHTML=''; }

function renderAbout(){
  document.getElementById('aboutText').innerText = SITE.aboutText;
  const portrait = document.getElementById('aboutPortrait');
  portrait.innerHTML = SITE.portraitUrl
    ? `<img src="${escAttr(SITE.portraitUrl)}" alt="${escAttr(SITE.storeName)}" onerror="this.parentElement.innerHTML='<span class=fallback>👾</span>'"/>`
    : `<span class="fallback">👾</span>`;
  const social = document.getElementById('socialRow');
  social.innerHTML = (SITE.socialLinks||[]).filter(l=>l.url).map(l=>`<a class="social-pill" href="${escAttr(l.url)}" target="_blank" rel="noopener">${esc(l.label||'Link')}</a>`).join('');
}
function renderContact(){
  document.getElementById('contactSub').innerText = SITE.contactSub;
  const box = document.getElementById('contactBox');
  box.innerHTML = SITE.contactEmail
    ? `<a class="btn btn-primary" href="mailto:${escAttr(SITE.contactEmail)}">Email ${esc(SITE.contactEmail)}</a>`
    : `<p style="color:var(--text-dim); font-size:13px;">No contact email set yet.</p>`;
}

function showModal(html){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">${html}</div>
    </div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape'){ closeLightbox(); closeModal(); } });

function init(){
  applySiteToDom();
  renderHero();
  renderGenreFilters();
  renderGamesGrid();
  renderAbout();
  renderContact();
}
init();
</script>
</body>
</html>
